name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Facts in the example conversations must match research/events.csv word for word.
      # Standard-library Python only; ubuntu-latest ships with python3.
      - name: Check example facts against events.csv
        run: python3 docs/rooms/changing-sea/examples/tools/check_examples.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build
